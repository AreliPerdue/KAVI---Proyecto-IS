<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#131313;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#131313;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <div style="color:#F2F2F2;font-size:30px;letter-spacing:6px;font-weight:300;">K A V I</div>
                <div style="color:#ABABAB;font-size:13px;letter-spacing:2px;padding-top:6px;">Plan more. be more.</div>
              </td>
            </tr>
            <tr>
              <td style="background:#1A1A1A;border:1px solid #303030;border-radius:16px;padding:28px 24px;">
                <p style="margin:0 0 6px;color:#F2F2F2;font-size:18px;font-weight:600;">Tu código de acceso</p>
                <p style="margin:0 0 20px;color:#ABABAB;font-size:15px;line-height:22px;">
                  Escríbelo en la app para terminar de crear tu cuenta.
                </p>
                <div style="background:#232323;border:1px solid #303030;border-radius:12px;padding:18px;text-align:center;">
                  <span style="color:#F2F2F2;font-size:34px;font-weight:700;letter-spacing:10px;font-variant-numeric:tabular-nums;">{{ .Token }}</span>
                </div>
                <p style="margin:20px 0 0;color:#8C8C8C;font-size:13px;line-height:20px;">
                  Vence en una hora. Si no fuiste tú, ignora este correo: sin el código nadie entra.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
