# Analisis de calidad con SonarQube Cloud (rubrica: fase 2, "Pruebas y calidad").
sonar.projectKey=AreliPerdue_KAVI---Proyecto-IS
sonar.organization=areliperdue
sonar.projectName=KAVI

# Solo el codigo de la app. `ios/` y `android/` los genera el prebuild de Expo,
# `dist/` es el export web y `.expo/` es cache: nada de eso lo escribimos nosotros.
sonar.sources=src
sonar.exclusions=**/node_modules/**,dist/**,ios/**,android/**,.expo/**,coverage/**,**/*.d.ts

# Las pruebas se declaran como tales para que no cuenten como codigo de produccion
# ni inflen la deuda tecnica.
sonar.tests=src
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx

# Cobertura de Jest. Sin esta linea el panel dice "A few extra steps are needed".
sonar.javascript.lcov.reportPaths=reports/pruebas/cobertura/lcov.info

# Ejecucion de las pruebas. La cobertura solo dice que lineas se ejercen; esto es
# lo que hace que el panel muestre cuantas pruebas hay, cuanto tardan y cuantas
# pasan. Lo genera scripts/sonar-pruebas.mjs a partir de la salida de Jest.
sonar.testExecutionReportPaths=reports/pruebas/ejecucion-sonar.xml

sonar.sourceEncoding=UTF-8
