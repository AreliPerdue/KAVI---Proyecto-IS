<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>KAVI Library</title>
    <!--
      Motor de lectura de KAVI Library (spec 13b §4, T279). Una sola página para las tres plataformas:
      la web la abre en un iframe y el teléfono en un WebView. Habla con la app solo por mensajes
      (ver engine.js). Los colores son los tokens de la app: tinta #131313 alrededor y papel blanco.
    -->
    <style>
      :root {
        --fondo: #131313;
        --papel: #ffffff;
        --tinta: #1a1a1a;
        --filtro-pdf: none;
        --marca: rgb(255 196 0 / 0.45);
        --marca-actual: rgb(255 122 92 / 0.65);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--fondo);
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #pdf {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 12px 0 96px;
        box-sizing: border-box;
        /* El pellizco lo atiende el motor (zoom, T288): el navegador no acerca la página entera. */
        touch-action: pan-x pan-y;
      }
      /* Acercado en scroll, la página puede ser más ancha que la pantalla. */
      #pdf.acercado {
        overflow-x: auto;
      }
      /* Páginas de lado (RF-BR7, T283): una a la vez, centrada; la pista se corre hacia los lados. */
      #pdf.paginado {
        overflow: hidden;
        padding: 0;
        touch-action: none;
      }
      #pdf.paginado .pista {
        display: flex;
        height: 100%;
        transition: transform 260ms ease-out;
      }
      #pdf.paginado .pista.sin-animar {
        transition: none;
      }
      #pdf.paginado .hoja {
        flex: 0 0 100%;
        height: 100%;
        display: flex;
        overflow: hidden;
        /* Lo que tapan los controles (T286b): la página se acomoda entre las barras. */
        box-sizing: border-box;
        padding: var(--reserva-arriba, 0px) 0 var(--reserva-abajo, 0px);
      }
      /* Centrada con márgenes automáticos: acercada y más grande que la hoja, se recorre desde la orilla. */
      #pdf.paginado .pagina {
        margin: auto;
        flex: none;
      }
      #pdf.paginado.acercado .hoja {
        overflow: auto;
        touch-action: pan-x pan-y;
      }
      @media (prefers-reduced-motion: reduce) {
        #pdf.paginado .pista {
          transition: none;
        }
      }
      .pagina {
        position: relative;
        margin: 0 auto 12px;
        background: var(--papel);
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.35);
        --scale-round-x: 1px;
        --scale-round-y: 1px;
      }
      .pagina canvas {
        filter: var(--filtro-pdf);
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Capa de texto de pdf.js (de pdf_viewer.css): transparente, para buscar y, en L3, subrayar. */
      .textLayer {
        position: absolute;
        text-align: initial;
        inset: 0;
        overflow: clip;
        opacity: 1;
        line-height: 1;
        letter-spacing: normal;
        word-spacing: normal;
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
        forced-color-adjust: none;
        transform-origin: 0 0;
        z-index: 0;
        --min-font-size: 1;
        --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
        --min-font-size-inv: calc(1 / var(--min-font-size));
      }
      .textLayer :is(span, br) {
        color: transparent;
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }
      .textLayer > :not(.markedContent),
      .textLayer .markedContent span:not(.markedContent) {
        z-index: 1;
        --font-height: 0;
        font-size: calc(var(--text-scale-factor) * var(--font-height));
        --scale-x: 1;
        --rotate: 0deg;
        transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
      }
      .textLayer .markedContent {
        display: contents;
      }
      .textLayer mark {
        color: transparent;
        background: var(--marca);
        border-radius: 2px;
      }
      .textLayer mark.actual {
        background: var(--marca-actual);
      }
      /* Libro real (RF-BR5, T284): el libro centrado en la pantalla, la hoja la dobla StPageFlip. */
      #libro {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        padding: var(--reserva-arriba, 0px) 0 var(--reserva-abajo, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      .libro-caja {
        max-width: 100%;
      }
      #libro {
        touch-action: none;
      }
      /* Libro real acercado (T288): encima, para mover la hoja sin doblarla. */
      #libro .lupa {
        position: absolute;
        inset: 0;
        z-index: 5;
        cursor: grab;
        touch-action: none;
      }
      .hoja-libro {
        background: var(--papel);
        overflow: hidden;
      }
      .hoja-libro canvas {
        filter: var(--filtro-pdf);
        display: block;
        width: 100%;
        height: 100%;
      }
      /* La página dentro de una hoja del libro real de un PDF (T330): su texto se selecciona. */
      .hoja-pdf {
        position: absolute;
      }
      #libro .textLayer,
      #libro .textLayer :is(span, br) {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Donde se acomodan los capítulos de un EPUB para contar sus páginas: fuera de la vista. */
      .libro-medidor {
        position: fixed;
        left: -100000px;
        top: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* Capa de anotaciones (13c, T286): encima de la página y de su capa de texto. Solo lo pegado recibe
         toques; lo demás pasa a la página (seleccionar texto, pasar de hoja). */
      .capa-anotaciones {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        container-type: size;
      }
      /* Los subrayados de un PDF (T287): encima del texto pero sin tapar la selección. */
      .capa-subrayados {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #capa-epub {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
      }
      .anotacion.seleccionada {
        outline: 2px solid #131313;
        outline-offset: 2px;
        box-shadow:
          0 0 0 5px #f2f2f2,
          0 4px 14px rgb(0 0 0 / 0.35) !important;
      }
      /* Asas para cambiar el tamaño de un post-it elegido (T329): esquinas visibles, orillas en su franja. */
      .anotacion .asa {
        position: absolute;
        z-index: 2;
        touch-action: none;
      }
      .anotacion .asa-n,
      .anotacion .asa-s {
        left: 12px;
        right: 12px;
        height: 16px;
        cursor: ns-resize;
      }
      .anotacion .asa-n {
        top: -8px;
      }
      .anotacion .asa-s {
        bottom: -8px;
      }
      .anotacion .asa-e,
      .anotacion .asa-w {
        top: 12px;
        bottom: 12px;
        width: 16px;
        cursor: ew-resize;
      }
      .anotacion .asa-e {
        right: -8px;
      }
      .anotacion .asa-w {
        left: -8px;
      }
      .anotacion .asa-ne,
      .anotacion .asa-nw,
      .anotacion .asa-se,
      .anotacion .asa-sw {
        width: 24px;
        height: 24px;
      }
      .anotacion .asa-ne,
      .anotacion .asa-nw,
      .anotacion .asa-se,
      .anotacion .asa-sw {
        display: grid;
        place-items: center;
      }
      .anotacion .asa-ne::after,
      .anotacion .asa-nw::after,
      .anotacion .asa-se::after,
      .anotacion .asa-sw::after {
        content: '';
        width: 12px;
        height: 12px;
        border-radius: 6px;
        background: #f2f2f2;
        border: 2px solid #131313;
        box-sizing: border-box;
      }
      .anotacion .asa-nw {
        left: -12px;
        top: -12px;
        cursor: nwse-resize;
      }
      .anotacion .asa-se {
        right: -12px;
        bottom: -12px;
        cursor: nwse-resize;
      }
      .anotacion .asa-ne {
        right: -12px;
        top: -12px;
        cursor: nesw-resize;
      }
      .anotacion .asa-sw {
        left: -12px;
        bottom: -12px;
        cursor: nesw-resize;
      }
      .anotacion .candado {
        position: absolute;
        right: 4px;
        bottom: 4px;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 11px;
        background: #131313;
        color: #f2f2f2;
      }
      /* Con la herramienta de post-it, la página dice que se puede pegar. */
      body.pegando .pagina,
      body.pegando #epub {
        cursor: copy;
      }
      /* Pegando, lo ya pegado deja pasar el toque: se puede pegar uno encima de otro. */
      body.pegando .anotacion {
        pointer-events: none !important;
      }
      #epub {
        position: absolute;
        inset: 0;
        background: var(--papel);
      }
      #epub foliate-view {
        display: block;
        height: 100%;
      }
    </style>
    <script type="module" src="./engine.js"></script>
  </head>
  <body></body>
</html>
