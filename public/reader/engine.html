<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>KAVI Library</title>
    <!--
      Motor de lectura de KAVI Library (spec 13b §4, T279). Una sola página para las tres plataformas:
      la web la abre en un iframe y el teléfono en un WebView. Habla con la app solo por mensajes
      (ver engine.js). Los colores son los tokens de la app: tinta #131313 alrededor y papel blanco.
    -->
    <style>
      :root {
        --fondo: #131313;
        --papel: #ffffff;
        --marca: rgb(255 196 0 / 0.45);
        --marca-actual: rgb(255 122 92 / 0.65);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--fondo);
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #pdf {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 12px 0 96px;
        box-sizing: border-box;
      }
      /* Páginas de lado (RF-BR7, T283): una a la vez, centrada; la pista se corre hacia los lados. */
      #pdf.paginado {
        overflow: hidden;
        padding: 0;
        touch-action: pinch-zoom;
      }
      #pdf.paginado .pista {
        display: flex;
        height: 100%;
        transition: transform 260ms ease-out;
      }
      #pdf.paginado .pista.sin-animar {
        transition: none;
      }
      #pdf.paginado .hoja {
        flex: 0 0 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #pdf.paginado .pagina {
        margin: 0;
        flex: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #pdf.paginado .pista {
          transition: none;
        }
      }
      .pagina {
        position: relative;
        margin: 0 auto 12px;
        background: var(--papel);
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.35);
        --scale-round-x: 1px;
        --scale-round-y: 1px;
      }
      .pagina canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Capa de texto de pdf.js (de pdf_viewer.css): transparente, para buscar y, en L3, subrayar. */
      .textLayer {
        position: absolute;
        text-align: initial;
        inset: 0;
        overflow: clip;
        opacity: 1;
        line-height: 1;
        letter-spacing: normal;
        word-spacing: normal;
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
        forced-color-adjust: none;
        transform-origin: 0 0;
        z-index: 0;
        --min-font-size: 1;
        --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
        --min-font-size-inv: calc(1 / var(--min-font-size));
      }
      .textLayer :is(span, br) {
        color: transparent;
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }
      .textLayer > :not(.markedContent),
      .textLayer .markedContent span:not(.markedContent) {
        z-index: 1;
        --font-height: 0;
        font-size: calc(var(--text-scale-factor) * var(--font-height));
        --scale-x: 1;
        --rotate: 0deg;
        transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
      }
      .textLayer .markedContent {
        display: contents;
      }
      .textLayer mark {
        color: transparent;
        background: var(--marca);
        border-radius: 2px;
      }
      .textLayer mark.actual {
        background: var(--marca-actual);
      }
      #epub {
        position: absolute;
        inset: 0;
        background: var(--papel);
      }
      #epub foliate-view {
        display: block;
        height: 100%;
      }
    </style>
    <script type="module" src="./engine.js"></script>
  </head>
  <body></body>
</html>
