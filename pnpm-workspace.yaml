allowBuilds:
  unrs-resolver: false
  # Vigilante de ficheros nativo que arrastra Jest: solo sirve para el modo
  # --watch en local, asi que no se compila. Hay que declararlo explicitamente
  # porque pnpm 11 convierte en error un script de build sin decision tomada,
  # mientras que pnpm 10 solo avisa.
  '@parcel/watcher': false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.21'
  - '@expo/fingerprint@0.20.12'
  - '@expo/metro-runtime@57.0.15'
  - '@expo/router-server@57.0.9'
  - '@expo/ui@57.0.15'
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-constants@57.0.17
  - expo-font@57.0.3
  - expo-image@57.0.4
  - expo-linking@57.0.9
  - expo-modules-core@57.0.15
  - expo-modules-jsi@57.0.7
  - expo-router@57.0.18
  - expo@57.0.19
  - expo-notifications@57.0.16
  - expo-secure-store@57.0.3

# Permitir el postinstall que descarga el binario de la CLI de Supabase
onlyBuiltDependencies:
  - supabase
  - unrs-resolver

patchedDependencies:
  expo-modules-jsi@57.0.7: patches/expo-modules-jsi@57.0.7.patch
